name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          # GitHub 托管 Runner 的 Microsoft 源偶发 403，重试几次避免 CI 误红
          for i in 1 2 3 4 5; do
            sudo apt-get update -o Acquire::Retries=5 && break
            echo "apt-get update failed, retrying ($i)..."
            sleep 10
          done
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile app.py photo.py lang.py

      - name: Run unit tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
  validate-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate plugin store manifest (plugins.json checksum/structure)
        run: python validate_store.py
