<!DOCTYPE html>
<html lang="zh-CN" data-theme="tokyo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Camera-WaterMark</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --radius-card:14px; --radius-ctl:9px; --radius-pill:999px;
  --dur:.2s; --ease:cubic-bezier(.4,0,.2,1);
  --topbar-h:50px; --toolbar-h:42px; --statusbar-h:38px; --left-w:268px; --right-w:332px;
}
/* 9 套主题（色值 1:1 对齐 theme-switcher v2.1） */
[data-theme="tokyo"]{--bg:#16171f;--elev:#1e2030;--soft:#252839;--field:#191b26;--line:#33384d;--fg:#d7dcec;--dim:#8a91ad;--accent:#5b8cff;--accent-fg:#fff;--canvas-bg:#12131b;--shadow:0 10px 30px rgba(0,0,0,.45)}
[data-theme="oled"]{--bg:#000;--elev:#0d0d10;--soft:#18181c;--field:#141417;--line:#2c2c33;--fg:#e8e8ea;--dim:#8b8b94;--accent:#6ea8fe;--accent-fg:#06101f;--canvas-bg:#000;--shadow:0 10px 30px rgba(0,0,0,.7)}
[data-theme="graphite"]{--bg:#202124;--elev:#292a2d;--soft:#303134;--field:#202124;--line:#3c4043;--fg:#e8eaed;--dim:#9aa0a6;--accent:#8ab4f8;--accent-fg:#101418;--canvas-bg:#1a1b1e;--shadow:0 10px 26px rgba(0,0,0,.4)}
[data-theme="forest"]{--bg:#121a17;--elev:#18221d;--soft:#1f2b25;--field:#141d19;--line:#2f3d36;--fg:#d6e4dc;--dim:#88a295;--accent:#4c9f70;--accent-fg:#0c1712;--canvas-bg:#0e1512;--shadow:0 10px 30px rgba(0,0,0,.45)}
[data-theme="amethyst"]{--bg:#1a1625;--elev:#221d30;--soft:#2b2540;--field:#1a1628;--line:#3a3355;--fg:#e2dcf0;--dim:#9a90b8;--accent:#a78bfa;--accent-fg:#160f29;--canvas-bg:#14101e;--shadow:0 10px 30px rgba(0,0,0,.45)}
[data-theme="mocha"]{--bg:#1e1a17;--elev:#27221d;--soft:#312b24;--field:#201b17;--line:#40382e;--fg:#e8ddd0;--dim:#a89884;--accent:#d4a373;--accent-fg:#241a10;--canvas-bg:#171310;--shadow:0 10px 30px rgba(0,0,0,.45)}
[data-theme="paper"]{--bg:#eef1f5;--elev:#ffffff;--soft:#eef1f5;--field:#ffffff;--line:#d4d9e2;--fg:#1f2430;--dim:#6b7280;--accent:#2563eb;--accent-fg:#fff;--canvas-bg:#e2e6ec;--shadow:0 12px 28px rgba(30,50,90,.12)}
[data-theme="cream"]{--bg:#f4efe6;--elev:#fdfbf6;--soft:#f6f0e4;--field:#fffdf8;--line:#e3dac8;--fg:#3a3128;--dim:#8a7d6b;--accent:#b45309;--accent-fg:#fffaf2;--canvas-bg:#ece4d6;--shadow:0 12px 26px rgba(90,70,30,.14)}
[data-theme="sakura"]{--bg:#fbeef4;--elev:#fff5f9;--soft:#fbdde9;--field:#ffffff;--line:#f2cfdf;--fg:#43283a;--dim:#a9788f;--accent:#e64f97;--accent-fg:#fff;--canvas-bg:#f6e0ec;--shadow:0 12px 28px rgba(214,72,130,.16)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--fg);font-size:13px;line-height:1.5;overflow:hidden;
  transition:background var(--dur),color var(--dur);animation:appIn .3s var(--ease) both;}
@keyframes appIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
button,select,input,textarea{font-family:inherit;color:inherit;font-size:12.5px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
button{cursor:pointer}

/* ===== 三栏骨架 ===== */
#app{display:grid;position:relative;height:100vh;
  grid-template-rows:var(--topbar-h) var(--toolbar-h) 1fr var(--statusbar-h);
  grid-template-columns:var(--left-w) 1fr var(--right-w);
  grid-template-areas:"top top top" "tool tool tool" "left main right" "status status status";
  gap:1px;background:var(--line);}
.topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 13px;background:var(--elev);}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand small{color:var(--dim);font-weight:500}
.top-spacer{flex:1}
.toolbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--radius-ctl);border:1px solid var(--line);background:var(--soft);color:var(--fg);transition:all .16s;white-space:nowrap}
.toolbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.toolbtn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.toolsel{padding:6px 8px;border-radius:var(--radius-ctl);border:1px solid var(--line);background:var(--soft);cursor:pointer}

/* 左栏 */
.left{grid-area:left;background:var(--elev);display:flex;flex-direction:column;min-height:0}
.pane-head{padding:11px 13px 8px;font-weight:600;font-size:12px;letter-spacing:.4px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.photo-list{flex:1;overflow:auto;padding:2px 6px 8px;display:flex;flex-direction:column;gap:3px}
.photo-item{display:flex;gap:10px;align-items:center;padding:6px 7px;border-radius:var(--radius-ctl);border:1px solid transparent;cursor:pointer}
.photo-item:hover{background:var(--soft)}
.photo-item.active{background:var(--soft);border-color:var(--accent)}
.thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;background:var(--soft);flex:none}
.photo-item .meta{min-width:0;flex:1}
.photo-item .meta b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.photo-item .meta span{color:var(--dim);font-size:10.5px}
.photo-item .del{flex:none;width:22px;height:22px;border-radius:6px;border:none;background:transparent;color:var(--dim);font-size:14px}
.photo-item .del:hover{color:#ff6b6b;background:var(--field)}
.pane-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}
.pane-foot .toolbtn{flex:1;justify-content:center}

/* 中间预览 */
.main{grid-area:main;background:var(--canvas-bg);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0}
.canvas-stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:18px;overflow:hidden;touch-action:none}
#preview{max-width:100%;max-height:100%;border-radius:6px;box-shadow:var(--shadow);transform-origin:center;will-change:transform;cursor:grab;touch-action:none}
#preview.grabbing{cursor:grabbing}
.zoombar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:5px 10px;background:var(--elev);border:1px solid var(--line);border-radius:var(--radius-pill);box-shadow:var(--shadow);z-index:5}
.zoombar button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--fg)}
.zoombar input{width:110px;accent-color:var(--accent)}
.zoombar span{min-width:42px;text-align:center;font-variant-numeric:tabular-nums;color:var(--dim)}
.drop-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:var(--dim);font-size:11px;background:var(--elev);border:1px dashed var(--line);padding:4px 12px;border-radius:var(--radius-pill);pointer-events:none;white-space:nowrap}
.main.dragover::after{content:attr(data-over);position:absolute;inset:14px;border:2px dashed var(--accent);border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:15px;background:color-mix(in srgb,var(--accent) 8%,transparent);z-index:6}

/* 右栏 */
.right{grid-area:right;background:var(--elev);overflow:hidden;min-height:0;display:flex;flex-direction:column}
.group{border-bottom:1px solid var(--line);padding:11px 14px}
.group>h4{font-size:11.5px;letter-spacing:.5px;color:var(--dim);margin-bottom:9px;display:flex;align-items:center;gap:7px;font-weight:600}
.group>h4::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--accent)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.row label{flex:none;color:var(--fg);white-space:nowrap}
.row .grow{flex:1;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);height:18px}
input[type=number],input[type=text],select.cmb{padding:4px 6px;border-radius:7px;border:1px solid var(--line);background:var(--field);text-align:right;font-variant-numeric:tabular-nums;width:62px}
select.cmb{width:100%;text-align:left;padding:6px 8px}
input[type=text]{text-align:left;width:100%}
textarea{width:100%;min-height:54px;resize:vertical;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--fg);line-height:1.5}
input[type=color]{width:34px;height:26px;padding:1px;border:1px solid var(--line);border-radius:7px;background:var(--field);cursor:pointer}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.field-grid.three{grid-template-columns:1fr 1fr 1fr}
.chk{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--field);font-size:12px;white-space:nowrap;overflow:hidden}
.chk:hover{border-color:var(--accent)}
.chk input{accent-color:var(--accent)}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:var(--radius-ctl);padding:3px;gap:3px}
.seg button{flex:1;padding:6px 3px;border:none;background:transparent;color:var(--dim);border-radius:6px;transition:all .15s;font-size:12px;white-space:nowrap}
.seg button.active{background:var(--accent);color:var(--accent-fg)}
.seg5 button{font-size:11px;padding:6px 1px}
.token-bar{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0}
.token-bar button{padding:3px 7px;font-size:11px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--dim)}
.token-bar button:hover{color:var(--fg);border-color:var(--accent)}
/* 九宫格 */
.anchor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:96px;flex:none}
.anchor-grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--field);border-radius:6px;color:var(--dim);font-size:10px}
.anchor-grid button.active{background:var(--accent);color:var(--accent-fg);border-color:transparent}
/* 图片水印槽位 */
.slot-card{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;background:var(--field)}
.slot-card>b{font-size:11.5px;color:var(--dim);display:block;margin-bottom:7px}
.logo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:7px;max-height:120px;overflow:auto;padding:2px}
.logo-chip{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--fg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-chip.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.logo-chip canvas,.logo-chip .logo-pv{max-width:100%;max-height:100%;object-fit:contain;display:block}
.logo-sep{grid-column:1/-1;font-size:10px;color:var(--muted,#888);padding:6px 2px 2px;border-top:1px solid var(--line);margin-top:4px;letter-spacing:.5px}
/* 顶部工具条 */
.toolbar{grid-area:tool;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--elev);border-top:1px solid var(--line);overflow:hidden}
.toolbar .sep{width:1px;height:22px;background:var(--line);flex:none}
.toolbar .zoombar{position:static;transform:none;border:none;box-shadow:none;background:transparent;padding:0;gap:6px;z-index:auto}
.toolbar .zoombar input{width:96px}
.tb-btn{padding:5px 10px;border-radius:var(--radius-ctl);border:1px solid var(--line);background:var(--soft);color:var(--fg);white-space:nowrap}
.tb-btn:hover{border-color:var(--accent)}
.tb-btn.active{border-color:var(--accent);color:var(--accent)}
.tb-search{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-search input{width:128px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
/* 左栏表格 */
.thead{display:flex;align-items:center;gap:8px;padding:5px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10.5px;color:var(--dim);letter-spacing:.3px;flex:none}
.photo-item{gap:8px;padding:4px 6px}
.photo-item input.pick{accent-color:var(--accent);flex:none;width:14px;height:14px}
.photo-item .thumb{width:38px;height:38px}
.photo-item .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* 右栏 Notebook */
.nb-tabs{display:flex;flex:none;border-bottom:1px solid var(--line);background:var(--elev)}
.nb-tab{flex:1;padding:9px 1px;border:none;background:transparent;color:var(--dim);border-bottom:2px solid transparent;font-size:11.5px;white-space:nowrap;transition:color .15s}
.nb-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.nb-pages{flex:1;overflow-y:auto;min-height:0}
.nb-page{display:none}.nb-page.active{display:block}
.nb-page .group:last-child{border-bottom:none}
.statusbar .toolbtn{padding:4px 12px}
.hidden{display:none!important}

/* 状态栏 */
.statusbar{grid-area:status;display:flex;align-items:center;gap:13px;padding:0 13px;background:var(--elev);border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.statusbar .right-slot{margin-left:auto;display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:#37d67a;box-shadow:0 0 8px #37d67a;flex:none}

/* 弹层 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center}
.modal-mask.open{display:flex}
.modal{width:min(560px,92vw);max-height:82vh;overflow:auto;background:var(--elev);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h3{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.modal h3 button{border:none;background:var(--soft);border-radius:7px;width:26px;height:26px;color:var(--fg)}
.preset-line{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--field)}
.preset-line:hover{border-color:var(--accent)}
.preset-line b{display:block}.preset-line span{color:var(--dim);font-size:11px}

/* ===== 手机形态 ===== */
#phone-frame{display:none}
body.phone{background:#0a0d14;align-items:center;justify-content:center;display:flex;overflow:auto;padding:18px}
body.phone #app{width:390px;height:844px;grid-template-rows:50px 40px 1fr 58px;grid-template-columns:1fr;
  grid-template-areas:"top" "tool" "main" "tabbar";border-radius:38px;overflow:hidden;border:9px solid #1c2230;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:phoneIn .35s var(--ease) both}
@keyframes phoneIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
body.phone .left,body.phone .right,body.phone .statusbar{display:none}
body.phone .toolbar{padding:0 8px;gap:5px}
body.phone .tb-search,body.phone .tb-sep-hide{display:none}
body.phone .zoombar,body.phone #zoomFit,body.phone #zoom100,body.phone #zoom200{display:none!important}
.phone-only-export{display:none}
body.phone .phone-only-export{display:flex}
body.phone .topbar{padding:0 12px;gap:6px}
body.phone .brand small,.topbtn-hide-phone{display:none}
.tabbar{display:none;grid-area:tabbar;background:var(--elev);border-top:1px solid var(--line);grid-template-columns:repeat(4,1fr);z-index:8}
body.phone .tabbar{display:grid}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--dim);border:none;background:transparent}
.tab.active{color:var(--accent)}
.tab svg{width:20px;height:20px}
.sheet-mask{display:none}
body.phone .sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:9;display:none}
.sheet{display:none;position:absolute;left:0;right:0;bottom:0;max-height:66%;background:var(--elev);border-radius:18px 18px 0 0;z-index:10;transform:translateY(108%);transition:transform .28s var(--ease);flex-direction:column}
body.phone .sheet{display:flex}
body.phone .sheet.open{transform:none;bottom:58px}
.sheet-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:600}
.sheet-body{overflow:auto;padding:2px 12px 16px}
.sheet-body .right{display:block!important;overflow:visible;background:transparent}
.sheet-body .nb-tabs{position:static}
.sheet-body .nb-pages{flex:none;overflow:visible}
body.phone .sheet-body .right.mode-edit .nb-tab[data-page="pexport"]{display:none}
body.phone .sheet-body .right.mode-export .nb-tabs{display:none}
#exitPhone{display:none}
body.phone #exitPhone{display:inline-flex}
/* 真机/移动全屏形态（区别于桌面“手机外壳模拟”body.phone） */
body.phone.device{padding:0;display:block;overflow:hidden;background:var(--bg)}
body.phone.device #app{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none;animation:none;grid-template-rows:calc(50px + env(safe-area-inset-top,0px)) 40px 1fr calc(58px + env(safe-area-inset-bottom,0px))}
body.phone.device .topbar{padding-top:env(safe-area-inset-top,0px)}
body.phone.device .tabbar{padding-bottom:env(safe-area-inset-bottom,0px)}
body.phone.device .sheet.open{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
body.phone.device .canvas-stage{padding:8px}
.sheet,#rightPane{transition:opacity .15s ease}
body.sliding .sheet,body.sliding #rightPane{opacity:.4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img src="cwm-logo.png" width="26" height="26" alt="Camera-WaterMark" style="border-radius:6px;display:block">
      Camera-WaterMark
    </div>
    <div class="top-spacer"></div>
    <button class="toolbtn topbtn-hide-phone" id="btnTpl" data-i18n="tplLib">模板库</button>
    <button class="toolbtn topbtn-hide-phone" id="btnAbout" data-i18n="about">关于</button>
    <select class="toolsel" id="themeSel"></select>
    <button class="toolbtn primary topbtn-hide-phone" id="btnPhone" data-i18n="phoneView">手机形态</button>
  </header>

  <div class="toolbar">
    <button class="tb-btn" id="btnImportTop" data-i18n="import">导入照片</button>
    <span class="sep tb-sep-hide"></span>
    <button class="tb-btn" id="zoomFit" data-i18n="fit">适应</button>
    <button class="tb-btn" id="zoom100">100%</button>
    <button class="tb-btn" id="zoom200">200%</button>
    <div class="zoombar">
      <button id="zoomOut">−</button>
      <input type="range" id="zoomRange" min="15" max="320" value="100">
      <span id="zoomVal">100%</span>
      <button id="zoomIn">＋</button>
    </div>
    <span class="sep tb-sep-hide"></span>
    <button class="tb-btn" id="btnSelAll" data-i18n="selAll">全选</button>
    <button class="tb-btn" id="btnSelNone" data-i18n="selNone">全不选</button>
    <button class="tb-btn" id="btnCompare" data-i18n="compare">对比原图</button>
    <div class="tb-search"><input type="search" id="searchInput" placeholder="搜索文件名/相机"></div>
  </div>

  <aside class="left">
    <div class="pane-head"><span data-i18n="photos">照片</span><span id="photoCount"></span></div>
    <div class="thead"><span style="width:15px"></span><span style="width:38px"></span><span style="flex:1" data-i18n="listHead">文件名 / 相机 · 参数</span></div>
    <div class="photo-list" id="photoList"></div>
    <div class="pane-foot">
      <button class="toolbtn primary" id="btnImport" data-i18n="import">导入照片</button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
  </aside>

  <main class="main" id="main" data-over="松开导入照片">
    <div class="canvas-stage"><canvas id="preview"></canvas></div>
    <div class="drop-hint" data-i18n="dropHint">拖入照片 · 滚轮缩放 · 拖空白平移 · 拖水印改位置</div>
  </main>

  <aside class="right" id="rightPane">
    <div class="nb-tabs">
      <button class="nb-tab active" data-page="ptext" data-i18n="nb_text">水印文字</button>
      <button class="nb-tab" data-page="pstyle" data-i18n="nb_style">样式</button>
      <button class="nb-tab" data-page="pimage" data-i18n="nb_image">图片水印</button>
      <button class="nb-tab" data-page="ppos" data-hideon="blur" data-i18n="nb_pos">位置</button>
      <button class="nb-tab" data-page="pdeco" data-hideon="blur" data-i18n="nb_deco">装饰</button>
      <button class="nb-tab" data-page="pexport" data-i18n="nb_export">导出</button>
    </div>
    <div class="nb-pages">
    <!-- 页1：水印文字 -->
    <div class="nb-page active" data-page="ptext">
    <div class="group" id="grpText">
      <h4 data-i18n="g_text">文字内容</h4>
      <textarea id="tplInput" spellcheck="false"></textarea>
      <div class="token-bar" id="tokenBar"></div>
      <div class="row"><label data-i18n="tplPreset">模板预设</label>
        <select class="cmb grow" id="tplPreset"></select></div>
      <div class="row"><label data-i18n="camOverride">机型覆盖</label>
        <input type="text" class="grow" id="camOverride" placeholder="自动读取 EXIF"></div>
      <div class="field-grid three" id="fieldGrid" style="margin-top:8px"></div>
    </div>
    <div class="group" id="grpFont">
      <h4 data-i18n="g_font">字体 / 文字</h4>
      <div class="row"><label data-i18n="fontFamily">字体</label>
        <select class="cmb grow" id="fontFamily"></select>
        <button class="toolbtn" id="btnLoadFont" data-i18n="loadFont">加载</button></div>
      <div id="c_fontSizePct"></div><div id="c_lineSpacing"></div><div id="c_wordSpacing"></div>
      <div class="row"><label data-i18n="textColor">颜色</label><input type="color" id="textColor">
        <label data-i18n="bold">加粗</label><input type="checkbox" id="bold"></div>
      <div id="c_textOpacity"></div>
    </div>
    </div>

    <!-- 页2：样式（文字/模糊切换 + 模糊卡 + 图片水印） -->
    <div class="nb-page" data-page="pstyle">
    <div class="group">
      <h4 data-i18n="g_style">水印样式</h4>
      <div class="seg" id="styleSeg">
        <button data-v="text" class="active" data-i18n="style_text">文字水印</button>
        <button data-v="blur" data-i18n="style_blur">模糊卡片</button>
      </div>
    </div>
    <div class="group hidden" id="grpBlur">
      <h4 data-i18n="g_blur">模糊卡片</h4>
      <div class="row"><label data-i18n="b_ratio">画面比例</label><select class="cmb grow" id="blurRatio"></select></div>
      <div class="row"><label data-i18n="b_layout">排版布局</label><select class="cmb grow" id="blurLayout"></select></div>
      <div id="c_fgScale"></div><div id="c_blurMargin"></div><div id="c_bgBlur"></div>

/* 生成一张白色品牌标 canvas（256 高，透明底） */

/* ---------- 模糊卡片（1:1 移植 blur-card 五布局 / badge / logo） ---------- */

 else if(L==='左参数'){const tw=iw*0.30;wm=[[mx,my,mx+tw,H-my]];fg=fitBox([mx+tw+gap,my,W-mx,H-my],rv,scale);}

function badgeRows(vals){

 else{const found=[...state.template.matchAll(/\{(\w+)\}/g)].map(m=>m[1].toLowerCase());keys=[...new Set(found)].filter(k=>['focal','aperture','shutter','iso'].includes(k)&&state.fields[k]!==false);if(!keys.length)keys=['aperture','shutter','iso'].filter(k=>state.fields[k]!==false);}

     else if(title){c.font='700 '+tfs+'px '+fontStack();c.fillStyle=`rgba(${tr},${tg},${tb},${ta/255})`;c.textAlign='center';c.fillText(title,cxm,y+tfs*0.7);y+=tfs*1.4+brandGap;}
     const vCol0=xBase+maxTagW+ig; // 数值列统一左缘
     for(const u of units){const cy=y+lineH/2,lk=u[0],val=u[1],tagw=u[2],valw=u[3];
       // 标签列
       c.font='600 '+bfs+'px '+fontStack();
       if(framed){ // 带框：F/S/ISO/mm 标签框统一为列宽 maxTagW，大小一致
         c.strokeStyle=`rgba(${tr},${tg},${tb},${ta/255})`;c.lineWidth=border;rr(c,xBase,cy-badgeH/2,maxTagW,badgeH,radius);c.stroke();
         c.fillStyle=`rgba(${tr},${tg},${tb},${ta/255})`;c.textAlign='center';c.fillText(lk,xBase+maxTagW/2,cy);}
       else{ // 不带框：宽度随文字、按方向对齐（保持不变）
         let tx=xBase;if(al==='右对齐')tx=xBase+maxTagW-tagw;else if(al==='居中')tx=xBase+(maxTagW-tagw)/2;
         c.fillStyle=`rgba(${tr},${tg},${tb},${labTa/255})`;
         if(al==='右对齐'){c.textAlign='right';c.fillText(lk,tx+tagw,cy);}else if(al==='居中'){c.textAlign='center';c.fillText(lk,tx+tagw/2,cy);}else{c.textAlign='left';c.fillText(lk,tx,cy);}}
       // 数值列：在等宽 maxValW 内按方向对齐
       c.font=(state.bold?'700 ':'')+' '+fs+'px '+fontStack();c.fillStyle=`rgba(${tr},${tg},${tb},${ta/255})`;
       if(al==='右对齐'){c.textAlign='right';c.fillText(val,vCol0+maxValW,cy);}
       else if(al==='居中'){c.textAlign='center';c.fillText(val,vCol0+maxValW/2,cy);}
       else{c.textAlign='left';c.fillText(val,vCol0,cy);}
       y+=lineH;}
     return;
   }
 }
}
function drawPlainText(c,text,box){ // 块内居中普通文字（含手动空格/参数间距）
 let[left,top,right,bottom]=box;const padx=Math.max(8,(right-left)/16),maxW=right-left-2*padx,maxH=bottom-top-8;
 const lines=text.split('\n'),n=Math.max(1,lines.length),userScale=clamp(state.fontSizePct/2.4,0.5,2);
 let start=clamp(maxH/(1.4*n)*0.96*userScale,10,maxH*0.5);const[tr,tg,tb]=hexRgb(state.textColor),ta=255*state.textOpacity/100;
 for(let fs=Math.floor(start);fs>=10;fs--){c.font=(state.bold?'700 ':'')+' '+fs+'px '+fontStack();const lineH=fs*1.4;let ok=true,widths=[];
   for(const ln of lines){const w=c.measureText(ln).width;widths.push(w);if(w>maxW)ok=false;}
   if(!ok||lineH*n>maxH)continue;
   const cx=(left+right)/2;let y=(top+bottom)/2-lineH*n/2;c.textAlign='center';c.textBaseline='middle';c.fillStyle=`rgba(${tr},${tg},${tb},${ta/255})`;
   lines.forEach((ln,i)=>c.fillText(ln,cx,y+lineH*i+lineH/2));return;
 }
}

function drawImageMarks(c,W,H,ph){
 ph._imgRects=[];
 const count=clamp(state.imgCount,1,5);
 const textRect=measureTextRect(W,H);
 for(let i=0;i<count;i++){const s=state.slots[i];drawOneMark(c,s,i,W,H,textRect,ph,i===0);}
}
function measureTextRect(W,H){ // 估算文字水印包围盒（供水印1对齐）
 const fs=Math.max(8,W*state.fontSizePct/100);const a=state.anchor,ax=(a-1)%3,ay=Math.floor((a-1)/3);
 const mx=W*state.marginPct/100,my=H*state.marginPct/100;
 const tw=W*0.42,th=fs*2.4;let x,y;
 if(ax===0)x=mx;else if(ax===2)x=W-mx-tw;else x=(W-tw)/2;
 if(ay===0)y=my;else if(ay===2)y=H-my-th;else y=(H-th)/2;
 return[x,y,x+tw,y+th];
}
function slotImage(slot,cb){
 if(slot.img){cb(slot.img);return;}
 if(slot.logo){const lc=makeLogoCanvas(slot.logo);if(lc)cb(lc);}
}
function drawOneMark(c,s,i,W,H,textRect,ph,isFirst){
 let lc=null;slotImage(s,im=>lc=im);if(!lc)return;
 const targetW=Math.max(1,W*s.size/100),ratio=targetW/lc.width,dw=targetW,dh=Math.max(1,lc.height*ratio);
 let drawW=dw,drawH=dh;
 // 旋转用临时 canvas
 let rotated=null;if(s.rot){const r=document.createElement('canvas');const rad=s.rot*Math.PI/180;r.width=Math.abs(Math.cos(rad)*dw)+Math.abs(Math.sin(rad)*dh)+1;r.height=Math.abs(Math.sin(rad)*dw)+Math.abs(Math.cos(rad)*dh)+1;const rc=r.getContext('2d');rc.translate(r.width/2,r.height/2);rc.rotate(rad);rc.globalAlpha=clamp(s.op,0,100)/100;rc.drawImage(lc,-dw/2,-dh/2,dw,dh);rotated=r;drawW=r.width;drawH=r.height;}
 let x,y;const align=isFirst?state.imgAlign:'无';
 let placed=false;
 if(isFirst&&align!=='无'&&textRect){const[tx0,ty0,tx1,ty1]=textRect,tw=tx1-tx0,th=ty1-ty0,gap=W*state.imgGap/100;
   const place=(dir)=>{let px,py;
     if(dir==='文字左-图右'){px=tx1+gap;py=ty0+(th-drawH)/2;}
     else if(dir==='图左-文字右'){px=tx0-gap-drawW;py=ty0+(th-drawH)/2;}
     else if(dir==='文字上-图下'){px=tx0+(tw-drawW)/2;py=ty1+gap;}
     else{px=tx0+(tw-drawW)/2;py=ty0-gap-drawH;}return[px,py];};
   const flip={'文字左-图右':'图左-文字右','图左-文字右':'文字左-图右','文字上-图下':'图上-文字下','图上-文字下':'文字上-图下'};
   for(const dir of[align,flip[align]||align]){const[px,py]=place(dir);if(px>=0&&py>=0&&px+drawW<=W&&py+drawH<=H){x=px;y=py;placed=true;break;}}
   if(!placed){if(align.includes('左')||align.includes('右')){x=tx0+tw/2-drawW/2;y=ty0+(th-drawH)/2;}else{x=tx0+(tw-drawW)/2;y=ty0+th/2-drawH/2;}x=clamp(x,0,W-drawW);y=clamp(y,0,H-drawH);placed=true;}
 }
 if(!placed){x=(W-drawW)*clamp(s.x,0,100)/100;y=(H-drawH)*clamp(s.y,0,100)/100;}
 c.save();if(!rotated)c.globalAlpha=clamp(s.op,0,100)/100;
 if(rotated)c.drawImage(rotated,x,y);else c.drawImage(lc,x,y,dw,dh);c.restore();
 if(ph)(ph._imgRects=ph._imgRects||[]).push({i,x,y,w:drawW,h:drawH});
}

function zoomAt(cx,cy,oldZ,newZ){const r=stage.getBoundingClientRect();

function hitTextMark(e,rect){
  const ph=curPhoto();if(!ph||!ph._textRect||state.style!=='text')return false;
  const fx=(e.clientX-rect.left)/rect.width,fy=(e.clientY-rect.top)/rect.height;
  if(fx<-.2||fx>1.2||fy<-.2||fy>1.2)return false;
  const {x:tx,y:ty,w:tw,h:th}=ph._textRect;
  const touchPad=document.body.classList.contains('device');
  const pad=(touchPad?18:4)*ph._W/Math.max(1,rect.width);

function hitImageMark(e,rect){
  const ph=curPhoto();if(!ph||!ph._imgRects||!ph._imgRects.length)return null;
  const lx=(e.clientX-rect.left)/rect.width*ph._W,ly=(e.clientY-rect.top)/rect.height*ph._H;
  const pad=(document.body.classList.contains('device')?18:4)*ph._W/Math.max(1,rect.width);
  for(let k=ph._imgRects.length-1;k>=0;k--){const r=ph._imgRects[k];
    if(lx>=r.x-pad&&lx<=r.x+r.w+pad&&ly>=r.y-pad&&ly<=r.y+r.h+pad)return {idx:r.i,gx:lx-r.x,gy:ly-r.y,w:r.w,h:r.h};}

stage.addEventListener('pointerdown',e=>{

    pinch={d:pDist(a,b),mx:m.x,my:m.y,z:state.zoom};drag=null;preview.classList.remove('grabbing');return;}
  if(pointers.size>2)return;
  const rect=preview.getBoundingClientRect();
  if(hitTextMark(e,rect)){const fx=(e.clientX-rect.left)/rect.width,fy=(e.clientY-rect.top)/rect.height;
    drag={mode:'wm',fx,fy,ox:state.offsetXPct,oy:state.offsetYPct};}
  else{const im=hitImageMark(e,rect);
    drag=im?{mode:'img',idx:im.idx,gx:im.gx,gy:im.gy,w:im.w,h:im.h}:{mode:'pan',x:e.clientX,y:e.clientY};}

    pinch.d=nd;pinch.mx=nm.x;pinch.my=nm.y;pinch.z=nz;setZoom(nz);return;}
  if(!drag)return;const ph=curPhoto();const rect=preview.getBoundingClientRect();
  if(drag.mode==='wm'&&ph){const fx=(e.clientX-rect.left)/rect.width,fy=(e.clientY-rect.top)/rect.height;
   state.offsetXPct=drag.ox+(fx-drag.fx)*100;state.offsetYPct=drag.oy+(fy-drag.fy)*100;
   syncSlider('offsetXPct');syncSlider('offsetYPct');scheduleRender();}
  else if(drag.mode==='img'&&ph){const fx=(e.clientX-rect.left)/rect.width,fy=(e.clientY-rect.top)/rect.height;
   const sl=state.slots[drag.idx];let nx=fx*ph._W-drag.gx,ny=fy*ph._H-drag.gy;
   if(drag.idx===0&&state.imgAlign!=='无'){state.imgAlign='无';const al=document.getElementById('imgAlign');if(al)al.value='无';}
   const rx=ph._W-drag.w,ry=ph._H-drag.h;
   if(rx>0)sl.x=clamp(nx/rx*100,0,100);if(ry>0)sl.y=clamp(ny/ry*100,0,100);scheduleRender();}
  else{state.panX+=e.clientX-drag.x;state.panY+=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;applyView();}
});
function endPtr(e){pointers.delete(e.pointerId);

  else{const [last]=[...pointers.values()];drag={mode:'pan',x:last.x,y:last.y};}}

function renderExport(ph){

 let WW=W,HH=H,k=1;const cap=5000;if(Math.max(W,H)>cap){k=cap/Math.max(W,H);WW=Math.round(W*k);HH=Math.round(H*k);}
 const oc=document.createElement('canvas');oc.width=WW;oc.height=HH;const c=oc.getContext('2d');c.setTransform(k,0,0,k,0,0);

// 无打包器：用 Capacitor bridge 的 toNative 自建插件代理（等价 @capacitor/core 的 registerPlugin）
function nativePlugin(pluginName){
  const C=window.Capacitor;if(!C||typeof C.toNative!=='function')return null;
  return new Proxy({},{get:(_t,method)=>{
    return (options)=>new Promise((resolve,reject)=>{
      try{C.toNative(pluginName,String(method),options||{},{resolve:resolve,reject:reject});}
      catch(e){reject(e);}
    });
  }});
}
function getGallerySaver(){
  if(!isNativeApp())return null;
  const C=window.Capacitor;
  if(C.Plugins&&C.Plugins.GallerySaver)return C.Plugins.GallerySaver;
  return nativePlugin('GallerySaver');

async function exportOne(ph){
  if(!ph)return;
  const native=isNativeApp();
  setStatus(L('正在导出…','Exporting…'));showToast(L('正在保存…','Saving…'));
  try{
    const{oc}=renderExport(ph);const mime=state.format==='jpg'?'image/jpeg':state.format==='webp'?'image/webp':'image/png';
    if(native){
      const GS=getGallerySaver();
      if(!GS)throw new Error(L('原生保存通道不可用','Native bridge unavailable'));
      const durl=oc.toDataURL(mime,state.quality/100);const b64=durl.slice(durl.indexOf(',')+1);
      const task=GS.saveImage({base64:b64,name:blobName(ph),mime:mime});
      const timeout=new Promise((_r,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),20000));
      await Promise.race([task,timeout]);
      setStatus(L('已保存到系统相册','Saved to gallery'));showToast(L('✓ 已保存到系统相册','✓ Saved to gallery'));
    }else{
      await browserDownload(oc,blobName(ph),mime,state.quality/100);
      setStatus(L('已导出','Exported'));showToast(L('✓ 已导出','✓ Exported'));
    }
  }catch(e){let reason=(e&&e.message)?e.message:String(e);
    if(reason==='NEED_PERMISSION')reason=L('需要存储权限（Android 9 及以下）','Storage permission required');
    if(reason==='TIMEOUT')reason=L('保存超时，请重试','Save timed out');
    setStatus(L('导出失败','Export failed')+': '+reason);showToast(L('导出失败：','Export failed: ')+reason);}
}

  const cmp=(a,b)=>{const pa=a.split('.').map(Number),pb=b.split('.').map(Number);for(let i=0;i<3;i++){if((pa[i]||0)>(pb[i]||0))return 1;if((pa[i]||0)<(pb[i]||0))return -1;}return 0;};
  if(cmp(remote,APP_VERSION)>0){
   const ua=navigator.userAgent||'';const native=window.Capacitor&&(window.Capacitor.isNativePlatform?window.Capacitor.isNativePlatform():false);
   const dl=(native||/Android|iPhone|iPad|iPod|Mobile/i.test(ua))?(j.download_android||j.download_url):(j.download_windows||j.download_url);
   const url=dl||j.url||'https://github.com/shiraijikuu/camera-watermark/releases';
   showModal(L('发现新版本 v'+remote,'New version v'+remote),
    L('当前版本 v'+APP_VERSION+'，最新版本 v'+remote+'。\n\n是否前往下载？','Current v'+APP_VERSION+', latest v'+remote+'.\n\nGo to download?'),
    [{text:L('稍后','Later'),cls:''},{text:L('下载','Download'),cls:'primary',onclick:()=>{window.open(url,'_blank');}}]);
  }else if(!silent){
   showModal(L('已是最新','Up to date'),L('当前版本 v'+APP_VERSION+' 已是最新版本。','Current v'+APP_VERSION+' is the latest.'),[{text:L('确定','OK'),cls:'primary'}]);
  }
 }catch(e){
  if(!silent)showModal(L('检查失败','Check failed'),L('无法获取更新信息：'+e.message,'Cannot fetch update: '+e.message),[{text:L('确定','OK'),cls:'primary'}]);
 }
}

/* 真机 WebView / 移动 UA / 窄屏：自动进入手机形态（无需手点“手机形态”） */
(function(){
 try{
  var ua=navigator.userAgent||'';
  var native=window.Capacitor&&(window.Capacitor.isNativePlatform?window.Capacitor.isNativePlatform():false);
  var narrow=window.matchMedia&&window.matchMedia('(max-width:820px)').matches;
  var mobileUA=/Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  if(native||narrow||mobileUA)document.body.classList.add('phone','device');
 }catch(e){}
})();
bindStatic();buildControls();fillTheme();applyI18n();
applyView();buildList();
mainEl.dataset.over=L('松开导入照片','Drop to import');
setStatus(L('就绪','Ready'));

</script>
